<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EARTH | NEUROSPACE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./planet.css">
</head>

<body data-c1="#0055ff" data-c2="#00ffff" data-rings="false" data-planet="earth">
    <div id="preloader">
        <canvas id="preloader-canvas"></canvas>
        <div class="loader-content">
            <h1>EARTH</h1>
        </div>
    </div>

    <a href="index.html" class="back-btn">← RETURN TO ORBIT</a>

    <canvas id="planet-canvas"></canvas>

    <!-- Scroll container to enable forest transition -->
    <div style="height: 400vh; pointer-events: none;"></div>

    <!-- Scroll hint -->
    <div id="scroll-hint" style="position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.7); font-family: 'Outfit', sans-serif; font-size: 0.85rem; letter-spacing: 0.2em; text-align: center; pointer-events: none; z-index: 10; animation: bounce 2s infinite;">
        ↓ SCROLL TO ENTER FOREST
    </div>
    <style>
        @keyframes bounce { 0%, 100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-8px); } }
    </style>

    <script type="module" src="./planet.js"></script>
</body>

</html>
